<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    /* Adapts to the browser chrome's theme. Light is the default, so a UA
       reporting no preference still gets a legible mark. */
    .bg     { fill: #0a0d0a; }
    .accent { fill: #16a34a; stroke: #16a34a; }
    @media (prefers-color-scheme: dark) {
      .accent { fill: #4ade80; stroke: #4ade80; }
    }
  </style>

  <rect class="bg" width="64" height="64" rx="14" />
  <rect class="accent" x="3" y="3" width="58" height="58" rx="12"
        fill="none" stroke-width="3" opacity="0.5" />

  <!-- Terminal prompt caret: ❯ -->
  <path class="accent" d="M19 21 L31 32 L19 43"
        fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cursor block -->
  <rect class="accent" x="35" y="37" width="15" height="6" rx="2" stroke="none" />
</svg>
